name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'organize_photos.py'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow imagehash

      - name: Build EXE
        run: pyinstaller --onefile --console --name organize_photos organize_photos.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: organize_photos-exe
          path: dist/organize_photos.exe
